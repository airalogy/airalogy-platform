[pytest]
markers =
    openai: marks tests that require the OpenAI API
    qwen: marks tests that require the Qwen API (DashScope API)
    e2e: real provider calls (explicit opt-in)
    integration: real paper-generation provider calls (explicit opt-in)
pythonpath = src
addopts = --import-mode=importlib -m "not openai and not qwen and not e2e and not integration"
